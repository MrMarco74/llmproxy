# Auto-Router: leitet Anfragen bei niedriger Komplexität auf kleinere Modelle um
# Komplexitäts-Score: 0.0 (trivial) bis 1.0 (sehr komplex)
# Regeln werden in Reihenfolge geprüft — erste Übereinstimmung gewinnt
#
# model_pattern: exakter Modellname ODER Prefix mit ":" am Ende ODER "*" für alle
# route_to:      Ziel-Modell
# target_gpu:    Optional. Index der Ziel-GPU (0, 1, ...) — an die eigene Hardware anpassen.
#                Wenn die Ziel-GPU ausgelastet ist, wird dynamisch gewechselt, falls möglich.

enabled: true

routes:

  - if_complexity_below: 0.15
    model_pattern: "qwen3:32b"
    route_to: "qwen3:8b"

  - if_complexity_below: 0.15
    model_pattern: "qwen3:14b"
    route_to: "qwen3:8b"

  # dana ist aktuell Single-GPU (RTX 3080, 12GB) - keine target_gpu-Pins mehr
  # aktiv. Falls wieder Multi-GPU-Hardware verfuegbar ist, koennen Beispiele
  # wie unten reaktiviert werden:
  #
  # - if_complexity_below: 0
  #   model_pattern: "llama3:8b"
  #   route_to: "llama3:8b"
  #   target_gpu: 1
  #
  # - if_complexity_below: 0
  #   model_pattern: "your-large-model:tag"
  #   route_to: "your-large-model:tag"
  #   target_gpu: 0
