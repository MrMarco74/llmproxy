[project]
name = "llmproxy-mcp"
version = "0.1.0"
description = "MCP server exposing llmproxy's guardrails/client/chargeback admin API for external automation (DLP, abuse mitigation, cost control)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3.0.0",  # FastMCP -> MCPServer (mcp.server.mcpserver) as of 2.0.0
    "httpx>=0.27.0",
]

[project.scripts]
llmproxy-mcp = "llmproxy_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llmproxy_mcp*"]
